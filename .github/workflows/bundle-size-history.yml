name: bundle-size-history

# Records the bundle of each commit pushed to main at https://bundle.nuxt.dev/nuxt-content/docus/tree/main,
# which charts the size after each commit and compares any commit with the one before it.
on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # The analyzer from atinux/nuxt-bundle-analyzer#27, which records prerendered pages, until it is released.
  NUXT_BUNDLE_ANALYZER_REPO: https://github.com/larbish/nuxt-bundle-analyzer
  NUXT_BUNDLE_ANALYZER_SHA: d0205866ea08e082a78124910d2947a61f134e10
  # The pages `--urls` renders, the same in `bundle-size.yml` and `bundle-size-history.yml`. Besides the landing page,
  # they load the heaviest lazy prose components, such as images and code trees. English only, as the French pages
  # load the same files.
  NUXT_BUNDLE_ANALYZER_URLS: /en,/en/getting-started/installation,/en/essentials/components,/en/essentials/code-blocks,/en/essentials/images-embeds
  # The upload is the same in that version.
  NUXT_BUNDLE_ANALYZER_VERSION: 0.1.7

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
      - name: Prepare the commit
        run: pnpm run dev:prepare
      - name: Build the analyzer
        run: |
          git clone --quiet "$NUXT_BUNDLE_ANALYZER_REPO" "$RUNNER_TEMP/nuxt-bundle-analyzer"
          cd "$RUNNER_TEMP/nuxt-bundle-analyzer"
          git checkout --quiet "$NUXT_BUNDLE_ANALYZER_SHA"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Analyze the bundle
        run: node "$RUNNER_TEMP/nuxt-bundle-analyzer/dist/cli.mjs" docs --extends ../layer --urls "$NUXT_BUNDLE_ANALYZER_URLS" --name main --no-serve
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_TELEMETRY_DISABLED: 1
      - name: Upload the bundle analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-history
          path: docs/node_modules/.cache/nuxt-bundle-analyzer/main
          if-no-files-found: error
          retention-days: 1

  # Apart from the build, so the dependencies it installs never run in a job that can prove to
  # bundle.nuxt.dev that it is this workflow.
  upload:
    name: upload
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Proves to bundle.nuxt.dev that the upload comes from this workflow on the default branch.
      id-token: write
    steps:
      # The upload reads the commit's message and time from git.
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Download the bundle analysis
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-history
          path: ${{ runner.temp }}/runs/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/-1
      - name: Upload to bundle.nuxt.dev
        run: >-
          npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" upload .
          --runs "$RUNNER_TEMP/runs"
          --name main
          --branch main
          --sha "$GITHUB_SHA"
          --url https://bundle.nuxt.dev
