name: bundle-size

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The analyzer from atinux/nuxt-bundle-analyzer#27, which records prerendered pages, until it is released.
  NUXT_BUNDLE_ANALYZER_REPO: https://github.com/larbish/nuxt-bundle-analyzer
  NUXT_BUNDLE_ANALYZER_SHA: 3c75d8e860fb3cff86e3796efb59f26fc9a806a9
  # The pages `--urls` renders, the same in `bundle-size.yml` and `bundle-size-history.yml`. Besides the landing page,
  # they load the heaviest lazy prose components, such as images and code trees. English only, as the French pages
  # load the same files.
  NUXT_BUNDLE_ANALYZER_URLS: /en,/en/getting-started/installation,/en/essentials/components,/en/essentials/code-blocks,/en/essentials/images-embeds

jobs:
  # Analyzes the docs of the base and the PR side by side, compared and posted by `bundle-size-comment.yml`.
  analyze:
    name: analyze (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [base, pr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The base commit for `base`, the PR merged into it for `pr`.
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || '' }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
      - name: Prepare
        run: pnpm run dev:prepare
      - name: Build the analyzer
        run: |
          git clone --quiet "$NUXT_BUNDLE_ANALYZER_REPO" "$RUNNER_TEMP/nuxt-bundle-analyzer"
          cd "$RUNNER_TEMP/nuxt-bundle-analyzer"
          git checkout --quiet "$NUXT_BUNDLE_ANALYZER_SHA"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Analyze the bundle
        run: node "$RUNNER_TEMP/nuxt-bundle-analyzer/dist/cli.mjs" docs --extends ../layer --urls "$NUXT_BUNDLE_ANALYZER_URLS" --name ${{ matrix.target }} --no-serve
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: docs/node_modules/.cache/nuxt-bundle-analyzer/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
