name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    env:
      NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build CLI
        run: pnpm run build
        working-directory: ./cli

      - name: Publish CLI and Layer
        run: npx pkg-pr-new publish --compact './cli' './layer'

  apps:
    name: app (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Remove once the entry is fixed, see `allow-failure` below.
    continue-on-error: ${{ matrix.allow-failure == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs, vercel
            app: docs
            preset: vercel
          - name: docs, vercel, baseURL
            app: docs
            preset: vercel
            base-url: /docs/
            # Prose images get the base twice and 404 in IPX (Nuxt UI `ProseImg` + `NuxtImg`).
            allow-failure: true
          - name: docs, node-server
            app: docs
            preset: node-server
            smoke: true

    env:
      NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
      NITRO_PRESET: ${{ matrix.preset }}
      NUXT_APP_BASE_URL: ${{ matrix.base-url || '/' }}
      # Always set on Vercel, without it `nuxt-llms` disables `llms.txt`.
      VERCEL_PROJECT_PRODUCTION_URL: docus-ci.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # The layer sets `failOnError: false` for users, CI wants broken links and missing assets to fail.
      - name: Fail on prerender errors
        run: echo "nitro.prerender.failOnError=true" >> ~/.nuxtrc

      - name: Build
        run: pnpm exec nuxt build ${{ matrix.app }} --extends ../layer

      - name: Check Vercel output
        if: matrix.preset == 'vercel'
        run: pnpm run check:vercel-output ${{ matrix.app }}

      - name: Smoke tests
        if: matrix.smoke
        run: |
          PORT=3000 node ${{ matrix.app }}/.output/server/index.mjs &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000/llms.txt; do sleep 1; done'
          pnpm run test:smoke
        env:
          SMOKE_URL: http://localhost:3000
          SMOKE_TARGET: node

  starters:
    name: starter (${{ matrix.starter }})
    runs-on: ubuntu-latest
    # Remove once the entry is fixed, see `allow-failure` below.
    continue-on-error: ${{ matrix.allow-failure == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - starter: default
            # Landing OG URL ends with `..png` when the description ends with a period, Nitro never writes it.
            allow-failure: true
          - starter: i18n

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Fail on prerender errors
        run: echo "nitro.prerender.failOnError=true" >> ~/.nuxtrc

      # Installs the packed layer from npm's point of view: `files`, dependencies and peers as users get them.
      - name: Pack, install and build
        run: ./scripts/test-starter.sh ${{ matrix.starter }}
        env:
          NITRO_PRESET: vercel
          VERCEL_PROJECT_PRODUCTION_URL: docus-ci.vercel.app
          WORKDIR: ${{ runner.temp }}/starter
          SKIP_TYPECHECK: 1

      # Non-blocking until the layer sources typecheck from `node_modules/docus`.
      - name: Typecheck
        continue-on-error: true
        run: npx nuxt typecheck
        working-directory: ${{ runner.temp }}/starter/app
