name: bundle-size-comment

# Runs from the default branch once `bundle-size` completes, also for fork PRs. The runs it reads come from the PR's
# build and are only parsed by nuxt-bundle-analyzer, never executed.
on:
  workflow_run:
    workflows:
      - bundle-size
    types:
      - completed

permissions:
  actions: read
  contents: read
  # Proves to bundle.nuxt.dev that the upload comes from this workflow on the default branch.
  id-token: write

env:
  NUXT_BUNDLE_ANALYZER_VERSION: 0.1.7

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/-1
      - name: Download the runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: runs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The comment is still posted without the comparison link when this fails.
      - name: Upload the runs to bundle.nuxt.dev
        id: upload
        continue-on-error: true
        run: npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" upload --runs runs --url https://bundle.nuxt.dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # GitHub makes `GITHUB_TOKEN` read-only in run chains that start from a fork's PR, so the app comments.
      - name: Mint bundle report app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUNDLE_REPORT_APP_ID }}
          private-key: ${{ secrets.BUNDLE_REPORT_APP_PRIVATE_KEY }}
          # What `comment --post` calls: it lists the open PRs, then creates or updates its comment.
          permission-pull-requests: write
      - name: Comment on the PR
        run: npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" comment --runs runs --post --link "$LINK"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          LINK: ${{ steps.upload.outputs.url }}
