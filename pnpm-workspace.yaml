packages:
  - ./
  - cli
  - docs
  - layer
  - playground

overrides:
  # devframe (via @nuxt/fonts) needs h3 v2.
  h3@1: 1.15.11
  ai: ^7.0.181
  '@ai-sdk/vue': ^4.0.181
  '@ai-sdk/gateway': ^4.0.154
  # Nuxt Content v4 isn't on npm yet: latest `v4` of nuxt/content.
  '@nuxt/content': https://pkg.pr.new/nuxt/content/@nuxt/content4@1e99a5a
  # Comark `main` until comark 0.10.0 is released.
  comark: https://pkg.pr.new/comarkdown/comark/comark@9f43d25
  '@comark/vue': https://pkg.pr.new/comarkdown/comark/@comark/vue@9f43d25
  # 0.8.3 refuses Nuxt Content v4: latest build of benjamincanac/nuxt-agent-discovery#61.
  nuxt-agent-discovery: https://pkg.pr.new/benjamincanac/nuxt-agent-discovery@584d145

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - '@vercel/speed-insights'
  - sharp

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Released with Nuxt 4.7, remove once older than minimumReleaseAge.
  - 'nitropack@2.14.0'
  - 'my-bad@1.3.1'
  - 'unhead@3.5.0'
  - '@unhead/vue@3.5.0'
  - '@unhead/bundler@3.5.0'
  - 'site-config-stack@5.0.4'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  # Comark
  - 'comark'
  - '@comark/*'
  - 'comark-content'

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

# The overrides above are pkg.pr.new tarballs.
blockExoticSubdeps: false
