packages:
  - ./
  - cli
  - docs
  - layer
  - playground

overrides:
  # devframe (via @nuxt/fonts) needs h3 v2.
  h3@1: 1.15.11
  ai: ^7.0.181
  '@ai-sdk/vue': ^4.0.181
  '@ai-sdk/gateway': ^4.0.154

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - '@vercel/speed-insights'
  - better-sqlite3
  - sharp

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Released with Nuxt 4.7, remove once older than minimumReleaseAge.
  - 'nitropack@2.14.0'
  - 'my-bad@1.3.1'
  - 'unhead@3.5.0'
  - '@unhead/vue@3.5.0'
  - '@unhead/bundler@3.5.0'
  - 'site-config-stack@5.0.4'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  # Comark
  - 'comark'
  - '@comark/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
