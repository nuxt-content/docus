packages:
  - ./
  - cli
  - docs
  - layer
  - playground

overrides:
  # Nuxt Content v4 POC (`@nuxt/content4`): PR #7 with shiki as a regular dependency (local fix), tarballs in `.content-v4/` (git-excluded)
  '@nuxt/content': file:./.content-v4/nuxt-content4-4.0.0-pr7-shiki-dep.tgz
  h3: 1.15.11
  ai: ^7.0.29
  '@ai-sdk/vue': ^4.0.29
  '@ai-sdk/gateway': ^4.0.21

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - '@vercel/speed-insights'
  - better-sqlite3
  - sharp

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  # Comark
  - 'comark'
  - 'comark-content'
  - '@comark/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

patchedDependencies:
  # Index build race fix, shipped as a patch in content-v4-temp
  comark-content@0.4.1: patches/comark-content@0.4.1.patch
  nuxt-agent-discovery@0.7.0: patches/nuxt-agent-discovery@0.7.0.patch
